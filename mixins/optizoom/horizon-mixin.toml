[mod]
id = "optizoom"
version = "1.0.0"
priority = 100

# Pinned: besides the native hook points it reaches inside Horizon in one place,
# camera.rs (Game's private `smooth_camera`, the cinematic camera OptiFine's zoom
# turns on), and release.rs uses `keybinds::key_name` as imported in
# native_hooks.rs. Re-check both before moving the pin.
[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "optizoom"
source = "runtime.rs"

[[module]]
id = "camera"
file = "crates/horizon-client/src/game.rs"
name = "optizoom_camera"
source = "camera.rs"

[[injection]]
id = "key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "release"
hook = "input_key"
hook_version = 1
kind = "HEAD"
helper = "release.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "event", ty = "&winit::event::KeyEvent", value = "event" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "wheel"
hook = "wheel"
hook_version = 1
kind = "HEAD"
helper = "wheel.rs"
bindings = [
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "zoom"
hook = "zoom"
hook_version = 1
kind = "HEAD"
helper = "zoom.rs"
bindings = [
  { name = "zoom", ty = "&mut Option<crate::game::native_hooks::NativeZoom>", value = "&mut *zoom" },
]

[[injection]]
id = "hand"
hook = "render_hand"
hook_version = 1
kind = "HEAD"
helper = "hand.rs"
bindings = [
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
